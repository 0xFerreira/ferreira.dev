<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MapLibre GL JS - 3D Terrain</title>
    <link href="https://unpkg.com/maplibre-gl@^5.13.0/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@^5.13.0/dist/maplibre-gl.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
        }
        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
        }
        .elevation-control {
            position: absolute;
            top: 10px;
            left: 10px;
            background: white;
            padding: 15px;
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
            font-family: Arial, sans-serif;
            z-index: 1;
        }
        .elevation-control label {
            display: block;
            margin-bottom: 5px;
            font-size: 12px;
            font-weight: bold;
        }
        .elevation-control input {
            width: 200px;
            margin-bottom: 10px;
        }
        .elevation-control .value {
            display: inline-block;
            min-width: 50px;
            margin-left: 10px;
            font-size: 12px;
        }
        .elevation-control select {
            width: 100%;
            padding: 5px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 3px;
            font-size: 12px;
        }
        .elevation-control input[type="number"] {
            width: 100px;
            padding: 5px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 3px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="elevation-control">
        <label>
            Tile Server:
        </label>
        <select id="tileServer">
            <option value="maplibre" selected>MapLibre Demo</option>
            <option value="agscan">AGScan Height Map</option>
        </select>

        <label>
            Color Scheme:
        </label>
        <select id="colorScheme">
            <option value="atlas" selected>Atlas (Blue-Green-Brown)</option>
            <option value="earth">Earth Tones</option>
            <option value="vegetation">Vegetation</option>
            <option value="arctic">Arctic</option>
            <option value="desert">Desert</option>
        </select>

        <div id="maplibreControls">
            <label>
                Elevation Range: <span class="value" id="maplibreValue">3000</span>m
            </label>
            <input type="range" id="maplibreElevation" min="100" max="6000" value="3000" step="100">
        </div>

        <div id="agscanControls" style="display: none;">
            <label>
                Elevation Range: <span class="value" id="agscanValue">2.5</span>m
            </label>
            <input type="range" id="agscanElevation" min="0.1" max="10" value="2.5" step="0.1">
        </div>

        <button id="toggle3D" style="margin-top: 10px; padding: 8px 16px; cursor: pointer; border: 1px solid #ccc; border-radius: 3px; background: white; font-size: 12px;">
            Enable 3D Mode
        </button>
    </div>
    <div id="map"></div>
    <script>
        // Color schemes for relief
        const colorSchemes = {
            atlas: [
                [4, 0, 108],      // Deep blue
                [5, 1, 154],
                [10, 21, 189],
                [16, 44, 218],
                [24, 69, 240],
                [20, 112, 193],
                [39, 144, 116],   // Blue-green
                [57, 169, 29],    // Green
                [111, 186, 5],
                [160, 201, 4],
                [205, 216, 2],    // Yellow
                [244, 221, 4],
                [251, 194, 14],
                [252, 163, 21],   // Orange
                [253, 128, 20],
                [254, 85, 14],
                [243, 36, 13],    // Red-brown
                [215, 5, 13]
            ],
            earth: [
                [34, 59, 30],     // Deep forest green
                [52, 78, 45],
                [70, 97, 60],
                [89, 59, 30],     // Deep brown
                [120, 80, 45],
                [150, 100, 60],
                [180, 130, 80],   // Light brown
                [200, 150, 100],
                [214, 184, 150],  // Sandy beige
                [220, 200, 170],
                [225, 210, 185],
                [190, 85, 50],    // Terracotta
                [200, 100, 60],
                [210, 120, 80],
                [220, 140, 100],
                [230, 160, 120],
                [240, 180, 140],
                [250, 240, 230]   // Pale cream
            ],
            vegetation: [
                [0, 51, 25],      // Dark forest green
                [20, 68, 35],
                [34, 87, 34],
                [45, 105, 45],
                [60, 125, 60],
                [80, 145, 80],
                [100, 160, 100],
                [120, 175, 120],
                [143, 188, 143],  // Sage green
                [160, 200, 160],
                [180, 215, 180],
                [200, 225, 200],
                [215, 235, 215],
                [225, 240, 225],
                [235, 245, 235],
                [242, 248, 242],
                [248, 252, 248],
                [255, 255, 255]   // White
            ],
            arctic: [
                [8, 29, 88],      // Deep ocean blue
                [20, 50, 120],
                [33, 102, 172],
                [67, 147, 195],
                [146, 197, 222],  // Light blue
                [180, 215, 235],
                [200, 230, 245],
                [220, 240, 250],
                [230, 245, 252],
                [240, 250, 255],
                [245, 252, 255],
                [250, 253, 255],
                [252, 254, 255],
                [253, 254, 255],
                [254, 255, 255],
                [255, 255, 255],  // Pure white
                [250, 250, 255],
                [245, 245, 255]   // Slight blue tint
            ],
            desert: [
                [120, 69, 19],    // Dark brown
                [139, 90, 43],
                [160, 110, 60],
                [180, 130, 80],
                [194, 145, 90],
                [210, 160, 100],
                [222, 184, 135],  // Burlywood
                [230, 200, 150],
                [238, 210, 170],
                [244, 220, 180],
                [245, 222, 179],  // Wheat
                [248, 230, 190],
                [250, 235, 200],
                [252, 240, 210],
                [253, 245, 220],
                [254, 248, 230],
                [255, 250, 240],
                [255, 253, 248]   // Light cream
            ]
        };

        // Color gradient function
        function generateColorRelief(minElev, maxElev, scheme = 'atlas') {
            const colors = colorSchemes[scheme];

            const stops = [];

            // Add transparent stops only if minElev is greater than 0
            if (minElev > 0) {
                stops.push(-10000, ['rgba', 0, 0, 0, 0]);
                stops.push(0, ['rgba', 0, 0, 0, 0]);
            }

            // Distribute colors evenly from minElev to maxElev
            const range = maxElev - minElev;
            const step = range / (colors.length - 1);

            colors.forEach((color, i) => {
                const elevation = minElev + (step * i);
                stops.push(elevation, ['rgba', ...color, 1]);
            });

            return [
                'interpolate',
                ['linear'],
                ['elevation'],
                ...stops
            ];
        }

        const map = new maplibregl.Map({
            container: 'map',
            zoom: 12,
            center: [11.39085, 47.27574],
            pitch: 0,
            style: {
                version: 8,
                sources: {
                    satellite: {
                        type: 'raster',
                        tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
                        tileSize: 256,
                        maxzoom: 19
                    },
                    terrainSource: {
                        type: 'raster-dem',
                        url: 'https://demotiles.maplibre.org/terrain-tiles/tiles.json',
                        tileSize: 256
                    },
                },
                layers: [
                    {
                        id: 'satellite',
                        type: 'raster',
                        source: 'satellite'
                    },
                    {
                        id: 'color-relief',
                        type: 'color-relief',
                        source: 'terrainSource',
                        paint: {
                            'color-relief-color': generateColorRelief(0.1, 3000)
                        }
                    }
                ]
            },
            maxZoom: 22,
            attributionControl: false
        });

        map.addControl(
            new maplibregl.NavigationControl({
                showZoom: true,
                showCompass: true
            })
        );

        // Force MapLibre Demo to be selected on load
        document.getElementById('tileServer').value = 'maplibre';
        document.getElementById('colorScheme').value = 'atlas';

        // Update color relief based on current tile server
        function updateColorRelief() {
            const selectedServer = document.getElementById('tileServer').value;
            const selectedScheme = document.getElementById('colorScheme').value;
            let maxElev;

            if (selectedServer === 'agscan') {
                maxElev = parseFloat(document.getElementById('agscanElevation').value);
                document.getElementById('agscanValue').textContent = maxElev;
            } else {
                maxElev = parseFloat(document.getElementById('maplibreElevation').value);
                document.getElementById('maplibreValue').textContent = maxElev;
            }

            map.setPaintProperty(
                'color-relief',
                'color-relief-color',
                generateColorRelief(0.1, maxElev, selectedScheme)
            );
        }

        // Tile server configurations
        const tileServers = {
            maplibre: {
                url: 'https://demotiles.maplibre.org/terrain-tiles/tiles.json',
                tiles: null,
                center: [11.39085, 47.27574],
                zoom: 12
            },
            agscan: {
                url: null,
                tiles: ['https://tiles.agscan.com.br/height_map/41be2472-ee6d-48d3-83d0-9ed8e03733c4/{z}/{x}/{y}.png'],
                tileSize: 512,
                center: [-44.303744, -21.351189],
                zoom: 18
            }
        };

        // Switch tile server
        function switchTileServer() {
            const selectedServer = document.getElementById('tileServer').value;
            const server = tileServers[selectedServer];

            // Toggle control visibility and update elevation values
            if (selectedServer === 'agscan') {
                document.getElementById('maplibreControls').style.display = 'none';
                document.getElementById('agscanControls').style.display = 'block';
                // Update to default AGScan elevation
                document.getElementById('agscanElevation').value = 2.5;
                document.getElementById('agscanValue').textContent = 2.5;
            } else {
                document.getElementById('maplibreControls').style.display = 'block';
                document.getElementById('agscanControls').style.display = 'none';
                // Update to default MapLibre elevation
                document.getElementById('maplibreElevation').value = 3000;
                document.getElementById('maplibreValue').textContent = 3000;
            }

            // Center map on the new location
            map.flyTo({
                center: server.center,
                zoom: server.zoom,
                duration: 1500
            });

            // Remove existing source
            if (map.getSource('terrainSource')) {
                // Remove layers using this source first
                if (map.getLayer('color-relief')) {
                    map.removeLayer('color-relief');
                }
                map.removeSource('terrainSource');
            }

            // Add new source
            const sourceConfig = {
                type: 'raster-dem',
                tileSize: server.tileSize || 256
            };

            if (server.url) {
                sourceConfig.url = server.url;
            } else {
                sourceConfig.tiles = server.tiles;
            }

            map.addSource('terrainSource', sourceConfig);

            // Re-add color-relief layer with appropriate elevation range
            const selectedScheme = document.getElementById('colorScheme').value;
            let maxElev;
            if (selectedServer === 'agscan') {
                maxElev = parseFloat(document.getElementById('agscanElevation').value);
            } else {
                maxElev = parseFloat(document.getElementById('maplibreElevation').value);
            }

            map.addLayer({
                id: 'color-relief',
                type: 'color-relief',
                source: 'terrainSource',
                paint: {
                    'color-relief-color': generateColorRelief(0.1, maxElev, selectedScheme)
                }
            });
        }

        // 3D mode toggle
        let is3DMode = false;
        function toggle3DMode() {
            is3DMode = !is3DMode;
            const button = document.getElementById('toggle3D');

            if (is3DMode) {
                // Enable 3D mode
                button.textContent = 'Disable 3D Mode';
                map.easeTo({
                    pitch: 60,
                    duration: 1000
                });

                // Add terrain if source exists with server-specific exaggeration
                if (map.getSource('terrainSource')) {
                    const selectedServer = document.getElementById('tileServer').value;
                    const exaggeration = selectedServer === 'agscan' ? 5 : 1.5;

                    map.setTerrain({
                        source: 'terrainSource',
                        exaggeration: exaggeration
                    });
                }
            } else {
                // Disable 3D mode
                button.textContent = 'Enable 3D Mode';
                map.easeTo({
                    pitch: 0,
                    duration: 1000
                });

                // Remove terrain
                map.setTerrain(null);
            }
        }

        // Event listeners
        document.getElementById('maplibreElevation').addEventListener('input', updateColorRelief);
        document.getElementById('agscanElevation').addEventListener('input', updateColorRelief);
        document.getElementById('tileServer').addEventListener('change', switchTileServer);
        document.getElementById('colorScheme').addEventListener('change', updateColorRelief);
        document.getElementById('toggle3D').addEventListener('click', toggle3DMode);
    </script>
</body>
</html>
