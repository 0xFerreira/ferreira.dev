<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Playfast — Board Metrics — February 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
:root {
  --bg: #f8f9fb;
  --surface: #ffffff;
  --card: #ffffff;
  --card-border: #e2e8f0;
  --card-hover: #f1f5f9;
  --blue: #2563eb;
  --blue-dim: rgba(37,99,235,.08);
  --blue-glow: rgba(37,99,235,.15);
  --orange: #d97706;
  --orange-dim: rgba(217,119,6,.08);
  --green: #16a34a;
  --green-dim: rgba(22,163,74,.08);
  --red: #dc2626;
  --red-dim: rgba(220,38,38,.08);
  --navy: #0f172a;
  --text: #1e293b;
  --text-secondary: #475569;
  --text-muted: #64748b;
  --text-faint: #94a3b8;
  --border: #e2e8f0;
  --font: 'Urbanist', -apple-system, sans-serif;
  --mono: 'JetBrains Mono', 'Fira Code', monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: var(--font); color: var(--text); background: var(--bg); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }

/* Header */
.header { background: var(--navy); padding: 20px 40px; display: flex; align-items: center; justify-content: space-between; }
.header h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; color: white; }
.header h1 span { font-weight: 400; color: #94a3b8; margin-left: 10px; font-size: 16px; }
.header-meta { font-size: 12px; color: #94a3b8; text-align: right; }
.header-month { font-size: 15px; font-weight: 700; color: white; letter-spacing: 1px; text-transform: uppercase; }

/* Tabs */
.tabs { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 40px; display: flex; gap: 0; position: sticky; top: 0; z-index: 100; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
.tab { padding: 14px 24px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--text-muted); border-bottom: 2px solid transparent; transition: all .2s; user-select: none; letter-spacing: 0.3px; }
.tab:hover { color: var(--text); }
.tab.active { color: var(--blue); border-bottom-color: var(--blue); }

/* Layout */
.content { max-width: 1320px; margin: 0 auto; padding: 28px 40px; }
.row { display: grid; gap: 20px; margin-bottom: 20px; }
.row-2 { grid-template-columns: 1fr 1fr; }
.row-3 { grid-template-columns: 1fr 1fr 1fr; }
.row-1 { grid-template-columns: 1fr; }

/* Cards */
.card { background: var(--card); border: 1px solid var(--card-border); border-radius: 10px; padding: 22px; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
.card-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-muted); margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }

/* KPI cards */
.kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
.kpi { background: var(--card); border: 1px solid var(--card-border); border-radius: 10px; padding: 24px; position: relative; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
.kpi::after { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--blue), var(--blue-dim)); }
.kpi-value { font-size: 36px; font-weight: 800; color: var(--navy); font-family: var(--mono); letter-spacing: -2px; line-height: 1; }
.kpi-label { font-size: 11px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; margin-top: 8px; }
.kpi-sub { font-size: 11px; color: var(--text-faint); margin-top: 4px; }

/* Info tooltip */
.info-icon { display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; border-radius: 50%; background: #e2e8f0; color: var(--text-muted); font-size: 9px; font-weight: 700; cursor: help; position: relative; flex-shrink: 0; transition: all .15s; font-style: normal; }
.info-icon:hover { background: var(--blue-dim); color: var(--blue); }
.info-icon .tooltip { display: none; position: absolute; bottom: calc(100% + 10px); left: 50%; transform: translateX(-50%); background: var(--navy); color: #cbd5e1; padding: 10px 14px; border-radius: 8px; font-size: 11px; font-weight: 400; white-space: normal; width: 280px; line-height: 1.6; text-transform: none; letter-spacing: 0; z-index: 200; box-shadow: 0 8px 24px rgba(0,0,0,.2); pointer-events: none; }
.info-icon .tooltip::after { content: ''; position: absolute; top: 100%; left: 50%; transform: translateX(-50%); border: 6px solid transparent; border-top-color: var(--navy); }
.info-icon:hover .tooltip { display: block; }

/* Tables */
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-muted); padding: 10px 12px; border-bottom: 2px solid var(--border); }
td { padding: 9px 12px; border-bottom: 1px solid #f1f5f9; color: var(--text-secondary); }
tr:hover td { background: #f8fafc; }
.num { text-align: right; font-family: var(--mono); font-size: 12px; font-weight: 500; color: var(--text); }
.trend-up { color: var(--green); font-weight: 600; }
.trend-down { color: var(--red); font-weight: 600; }
.trend-flat { color: var(--text-faint); }
.badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 10px; font-weight: 700; letter-spacing: 0.5px; }
.badge-user { background: var(--blue-dim); color: var(--blue); }
.badge-company { background: var(--orange-dim); color: var(--orange); }
.badge-professor { background: var(--green-dim); color: var(--green); }
.badge-admin { background: rgba(100,116,139,.15); color: var(--text-muted); }

/* Heatmap */
.heatmap-cell { border-radius: 3px; min-height: 18px; min-width: 18px; transition: box-shadow .15s; }
.heatmap-cell:hover { box-shadow: 0 0 6px rgba(0,0,0,.15); }

/* Retention grid */
.retention-grid td { text-align: center; font-family: var(--mono); font-size: 11px; min-width: 60px; border-radius: 4px; }

/* Search */
.search { padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; width: 320px; outline: none; background: white; color: var(--text); font-family: var(--font); }
.search:focus { border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-dim); }
.search::placeholder { color: var(--text-faint); }

/* Chart containers */
.chart-container { position: relative; width: 100%; }
.chart-container canvas { width: 100% !important; }

/* Toggle */
.toggle-group { display: flex; gap: 0; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-bottom: 14px; }
.toggle-btn { padding: 7px 16px; font-size: 12px; cursor: pointer; background: white; border: none; color: var(--text-muted); font-weight: 600; font-family: var(--font); transition: all .15s; }
.toggle-btn:hover { color: var(--text); }
.toggle-btn.active { background: var(--blue); color: white; }

/* Methodology */
.methodology { background: #f1f5f9; border: 1px solid var(--border); border-radius: 10px; padding: 24px; margin-top: 36px; }
.methodology h3 { font-size: 13px; font-weight: 700; color: var(--text-secondary); margin-bottom: 14px; cursor: pointer; user-select: none; letter-spacing: 0.3px; }
.methodology dl { display: grid; grid-template-columns: 160px 1fr; gap: 6px 20px; font-size: 12px; }
.methodology dt { font-weight: 600; color: var(--text-muted); }
.methodology dd { color: var(--text-muted); line-height: 1.6; }
.methodology code { background: var(--blue-dim); color: var(--blue); padding: 1px 5px; border-radius: 3px; font-family: var(--mono); font-size: 11px; }

/* Scrollable table wrapper */
.table-wrap { overflow-x: auto; }

/* Stagger animation */
@keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
.kpi { animation: fadeUp .4s ease-out both; }
.kpi:nth-child(2) { animation-delay: .06s; }
.kpi:nth-child(3) { animation-delay: .12s; }
.kpi:nth-child(4) { animation-delay: .18s; }

/* Print */
@media print {
  .tabs { display: none; }
  .header { padding: 12px 20px; }
  .content { max-width: 100%; padding: 12px 20px; }
  .card { break-inside: avoid; box-shadow: none; }
  body { font-size: 11px; }
}
</style>
</head>
<body>
<div id="app">
  <!-- Password gate -->
  <div v-if="!unlocked" style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg)">
    <div style="text-align:center">
      <h1 style="font-size:22px;font-weight:800;color:var(--navy);margin-bottom:24px">Playfast <span style="font-weight:400;color:var(--text-muted)">Board Metrics</span></h1>
      <form @submit.prevent="checkPassword" style="display:flex;gap:8px">
        <input type="password" v-model="passwordInput" placeholder="Password" class="search" style="width:220px" autofocus>
        <button type="submit" class="toggle-btn active" style="border-radius:8px;padding:10px 20px;border:none;cursor:pointer;font-family:var(--font);font-weight:600">Enter</button>
      </form>
      <div v-if="passwordError" style="color:var(--red);font-size:12px;margin-top:8px">Incorrect password</div>
    </div>
  </div>

  <template v-if="unlocked">
  <!-- Header -->
  <div class="header">
    <h1>Playfast<span>Board Metrics</span></h1>
    <div class="header-meta">
      <div class="header-month">February 2026</div>
      <div>{{ D.meta.date_range[0] }} — {{ D.meta.date_range[1] }}</div>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <div v-for="t in tabs" :key="t.id" class="tab" :class="{active: tab===t.id}" @click="tab=t.id">{{ t.label }}</div>
  </div>

  <div class="content">

    <!-- ============ OVERVIEW ============ -->
    <div v-show="tab==='overview'">
      <div class="kpi-row" style="grid-template-columns: repeat(4, 1fr)">
        <div class="kpi">
          <div class="kpi-value">R${{ fmtMoney(D.financial.total_mrr) }}</div>
          <div class="kpi-label">Monthly Recurring Revenue</div>
          <div class="kpi-sub">{{ fmt(D.financial.total_active_subs) }} active subscriptions</div>
        </div>
        <div class="kpi">
          <div class="kpi-value" style="color:var(--green)">+R${{ fmtMoney(D.financial.feb_net_mrr) }}</div>
          <div class="kpi-label">Net MRR Growth (Feb)</div>
          <div class="kpi-sub">+{{ fmt(D.financial.feb_new_subs) }} new / −{{ fmt(D.financial.feb_cancelled_subs) }} cancelled</div>
        </div>
        <div class="kpi">
          <div class="kpi-value">R${{ fmt(D.financial.avg_plan_value) }}</div>
          <div class="kpi-label">Avg Plan Value</div>
          <div class="kpi-sub">median R${{ fmt(D.financial.median_plan_value) }}</div>
        </div>
        <div class="kpi">
          <div class="kpi-value">{{ fmt(D.meta.total_unique_users) }}</div>
          <div class="kpi-label">Active Users (Feb)</div>
          <div class="kpi-sub">{{ D.meta.total_unique_companies }} companies · {{ D.professors.length }} professors</div>
        </div>
      </div>

      <div class="row row-1">
        <div class="card">
          <div class="card-title">
            Daily Unique Users by Role
            <span class="info-icon">i<span class="tooltip">Unique user accounts per day, broken down by database role. USER = app clients, COMPANY = franchise managers (web), PROFESSOR = instructors (app). More meaningful than raw event counts.</span></span>
          </div>
          <div class="toggle-group">
            <button class="toggle-btn" :class="{active: overviewMode==='unique'}" @click="overviewMode='unique'; renderDailyChart()">Unique Users</button>
            <button class="toggle-btn" :class="{active: overviewMode==='events'}" @click="overviewMode='events'; renderDailyChart()">Events</button>
          </div>
          <div class="chart-container" style="height:280px"><canvas id="dailyChart"></canvas></div>
        </div>
      </div>

      <div class="row row-2">
        <div class="card">
          <div class="card-title">
            App vs Web — Unique Users
            <span class="info-icon">i<span class="tooltip">Unique users per day by platform. App = clients + professors (USER and PROFESSOR roles). Web = franchise managers (COMPANY role). Each role has its own frontend by design.</span></span>
          </div>
          <div class="chart-container" style="height:220px"><canvas id="originChart"></canvas></div>
        </div>
        <div class="card">
          <div class="card-title">
            Weekly Active Users
            <span class="info-icon">i<span class="tooltip">Unique users who performed at least one action per ISO week, grouped by role.</span></span>
          </div>
          <div class="chart-container" style="height:220px"><canvas id="weeklyChart"></canvas></div>
        </div>
      </div>

      <div class="row row-1">
        <div class="card">
          <div class="card-title">
            Hourly Activity by Role — Normalized
            <span class="info-icon">i<span class="tooltip">Each role's hourly activity as a percentage of its own monthly total. This reveals when each role is most active relative to itself, removing volume differences. Peaks show the preferred hours for each user type.</span></span>
          </div>
          <div class="chart-container" style="height:260px"><canvas id="hourlyProfileChart"></canvas></div>
        </div>
      </div>

      <div class="row row-1" v-for="hm in heatmaps" :key="hm.key">
        <div class="card">
          <div class="card-title">
            {{ hm.label }}
            <span class="badge" :class="'badge-'+hm.key" style="margin-left:4px">{{ hm.roleLabel }}</span>
            <span class="info-icon">i<span class="tooltip">{{ hm.tip }}</span></span>
          </div>
          <div class="table-wrap">
            <table style="table-layout:fixed">
              <thead>
                <tr>
                  <th style="width:40px"></th>
                  <th v-for="d in D.daily_summary" :key="d.date" style="width:36px;text-align:center;font-size:10px;padding:4px 2px;border:none" :style="{color: isWeekend(d.date)?'var(--text-faint)':'var(--text-muted)', opacity: isWeekend(d.date)?0.5:1}">
                    {{ d.date.slice(8) }}<br>{{ d.weekday.slice(0,2) }}
                  </th>
                </tr>
              </thead>
              <tbody>
                <tr v-for="h in 24" :key="h">
                  <td style="font-size:11px;color:var(--gray-500);text-align:right;padding:2px 6px">{{ String(h-1).padStart(2,'0') }}h</td>
                  <td v-for="d in D.daily_summary" :key="d.date+h+hm.key"
                      style="padding:2px"
                      :title="d.date+' '+String(h-1).padStart(2,'0')+'h: '+roleHeatVal(hm.key,d.date,h-1)+' events'">
                    <div class="heatmap-cell" :style="{background: roleHeatColor(hm.key, roleHeatVal(hm.key,d.date,h-1))}"></div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <!-- ============ COMPANIES ============ -->
    <div v-show="tab==='companies'">
      <div class="row row-1">
        <div class="card">
          <div class="card-title">
            Company Engagement Ranking
            <span class="info-icon">i<span class="tooltip">All companies with events in February. Sortable by any column. Trend compares first vs second half of the month. Rev/Sub = MRR ÷ active subscriptions — average subscription value per franchise.</span></span>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th style="width:30px">#</th>
                  <th style="cursor:pointer" @click="sortCompanies('name')">Company{{ sortIcon('name') }}</th>
                  <th class="num" style="cursor:pointer" @click="sortCompanies('mrr')">MRR{{ sortIcon('mrr') }}</th>
                  <th class="num" style="cursor:pointer" @click="sortCompanies('active_subs')">Subs{{ sortIcon('active_subs') }}</th>
                  <th class="num" style="cursor:pointer" @click="sortCompanies('rev_per_sub')">Rev/Sub{{ sortIcon('rev_per_sub') }}</th>
                  <th class="num" style="cursor:pointer" @click="sortCompanies('total_events')">Events{{ sortIcon('total_events') }}</th>
                  <th class="num" style="cursor:pointer" @click="sortCompanies('unique_users')">Users{{ sortIcon('unique_users') }}</th>
                  <th class="num" style="cursor:pointer" @click="sortCompanies('days_active')">Days{{ sortIcon('days_active') }}</th>
                  <th style="width:80px;text-align:center">Trend</th>
                </tr>
              </thead>
              <tbody>
                <tr v-for="(c,i) in sortedCompanies" :key="c.companyid">
                  <td style="color:var(--gray-400)">{{ i+1 }}</td>
                  <td>
                    <div style="font-weight:500">{{ c.shortname || c.name }}</div>
                  </td>
                  <td class="num" style="font-weight:600">{{ c.mrr ? 'R$' + fmt(Math.round(c.mrr)) : '—' }}</td>
                  <td class="num">{{ c.active_subs || '—' }}</td>
                  <td class="num" style="font-weight:600">{{ c.rev_per_sub ? 'R$' + fmt(Math.round(c.rev_per_sub)) : '—' }}</td>
                  <td class="num">{{ fmt(c.total_events) }}</td>
                  <td class="num">{{ c.unique_users }}</td>
                  <td class="num">{{ c.days_active }}/28</td>
                  <td style="text-align:center;white-space:nowrap">
                    <span v-if="c.events_first_half > 0" :class="trendClass(c.events_first_half, c.events_second_half)">
                      {{ trendArrow(c.events_first_half, c.events_second_half) }}
                      {{ trendPct(c.events_first_half, c.events_second_half) }}
                    </span>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="row row-2">
        <div class="card">
          <div class="card-title">
            MRR vs Active Users
            <span class="info-icon">i<span class="tooltip">Each dot is a company. X = unique users in February, Y = monthly recurring revenue. Size = number of active subscriptions. Companies above the trend line monetize their user base well. Below = potential for upsell or churn risk.</span></span>
          </div>
          <div class="chart-container" style="height:380px"><canvas id="scatterChart"></canvas></div>
        </div>
        <div class="card">
          <div class="card-title">
            Revenue per Subscriber — Top 15
            <span class="info-icon">i<span class="tooltip">MRR divided by active subscriptions. Shows average subscription value per franchise. High values indicate premium pricing or plan upsell success. Filtered to companies with 10+ subs.</span></span>
          </div>
          <div class="chart-container" style="height:380px"><canvas id="revPerUserChart"></canvas></div>
        </div>
      </div>
    </div>

    <!-- ============ USERS ============ -->
    <div v-show="tab==='users'">
      <div class="row row-2">
        <div class="card">
          <div class="card-title">
            Event Share by Role
            <span class="info-icon">i<span class="tooltip">Share of total events per database role. COMPANY (franchise managers) generate more events per user than clients because they operate the web dashboard all day.</span></span>
          </div>
          <div class="chart-container" style="height:260px"><canvas id="roleDonut"></canvas></div>
        </div>
        <div class="card">
          <div class="card-title">
            Action Categories
            <span class="info-icon">i<span class="tooltip">Events classified by route pattern. Scheduling and client management dominate. Auth includes logins. About 33% of API endpoints have logging disabled (@SkipLog) — these counts represent navigations and actions, not raw throughput.</span></span>
          </div>
          <div class="chart-container" style="height:260px"><canvas id="actionsChart"></canvas></div>
        </div>
      </div>

      <div class="row row-3">
        <div class="card">
          <div class="card-title">
            Top End Users
            <span class="badge badge-user" style="margin-left:4px">USER</span>
            <span class="info-icon">i<span class="tooltip">App clients. These are the people booking classes, checking schedules, managing credits via the mobile app.</span></span>
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Name</th><th class="num">Events</th><th class="num">Days</th></tr></thead>
              <tbody>
                <tr v-for="u in D.top_users.user.slice(0,15)" :key="u.uid">
                  <td>{{ u.name }}</td>
                  <td class="num">{{ fmt(u.events) }}</td>
                  <td class="num">{{ u.days_active }}</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
        <div class="card">
          <div class="card-title">
            Top Managers
            <span class="badge badge-company" style="margin-left:4px">COMPANY</span>
            <span class="info-icon">i<span class="tooltip">Franchise managers operating the web dashboard. High event counts reflect daily operational use: scheduling, client management, financial oversight.</span></span>
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Name</th><th class="num">Events</th><th class="num">Days</th><th class="num">Co.</th></tr></thead>
              <tbody>
                <tr v-for="u in D.top_users.company.slice(0,15)" :key="u.uid">
                  <td>{{ u.name }}</td>
                  <td class="num">{{ fmt(u.events) }}</td>
                  <td class="num">{{ u.days_active }}</td>
                  <td class="num">{{ u.companies.length }}</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
        <div class="card">
          <div class="card-title">
            Top Professors
            <span class="badge badge-professor" style="margin-left:4px">PROFESSOR</span>
            <span class="info-icon">i<span class="tooltip">Instructors using the app to check schedules and log class attendance (presence). Low event counts are normal — professors have fewer in-app actions than managers.</span></span>
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Name</th><th class="num">Events</th><th class="num">Days</th></tr></thead>
              <tbody>
                <tr v-for="u in D.professors.slice(0,15)" :key="u.uid">
                  <td>{{ u.name }}</td>
                  <td class="num">{{ fmt(u.events) }}</td>
                  <td class="num">{{ u.days_active }}</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="row row-1">
        <div class="card">
          <div class="card-title">
            Franchise Operations Team
            <span class="info-icon">i<span class="tooltip">COMPANY-role users who accessed more than 3 different franchise locations this month. These are the operations/oversight team managing multiple units.</span></span>
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Name</th><th class="num">Events</th><th class="num">Days Active</th><th class="num">Companies</th></tr></thead>
              <tbody>
                <tr v-for="u in franchiseOps" :key="u.uid">
                  <td>{{ u.name }}</td>
                  <td class="num">{{ fmt(u.events) }}</td>

                    {{ row.cells[w] !== undefined ? row.cells[w]+'%' : '' }}

              </tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="row row-1">
        <div class="card">
          <div class="card-title">

              <thead><tr><th>Name</th><th>Company</th></tr></thead>

        <div class="card">
          <div class="card-title">
            Inactive Manager Accounts

            </table>

    <!-- ============ GLOSSARY & METHODOLOGY ============ -->
    <div class="methodology">
      <h3 @click="showMethodology=!showMethodology">{{ showMethodology ? '▾' : '▸' }} Methodology & Glossary</h3>
      <div v-show="showMethodology">
        <dl>
          <dt>Data Source</dt>
          <dd><code>event_user_log</code> table — application-level event log written by NestJS interceptor on each API request. Not raw HTTP logs.</dd>

          <dt>Period</dt>
          <dd>February 1–28, 2026 (full month, no gaps).</dd>

          <dt>Excluded</dt>
          <dd>Uptime monitor (uid 54773, ~47% of raw events). Notification polling routes: <code>/webNotifications/unread</code>, <code>/webSystemNotification</code>, <code>/notificationBanner</code> (16% of remaining events). These are automated browser requests, not user actions.</dd>

          <dt>Unlogged Endpoints</dt>
          <dd>~33% of API endpoints have <code>@SkipLog</code> (agenda detail views, product lookups, financial breakdowns). Event counts represent navigations and deliberate actions, not total API throughput. Actual request volume is ~40% higher.</dd>

          <dt>Roles</dt>
          <dd>From <code>useraccount.role</code> database enum. <strong>USER</strong> = end client (mobile app). <strong>COMPANY</strong> = franchise manager (web dashboard). <strong>PROFESSOR</strong> = instructor (mobile app). <strong>ADMIN</strong> = system admin (5 accounts, mostly inactive system users).</dd>

          <dt>Origin</dt>
          <dd>Determined by JWT token type on the endpoint, not user choice. <code>app</code> = mobile app endpoints. <code>web</code> = dashboard endpoints. Each role maps to one origin by design.</dd>

          <dt>Company Attribution</dt>
          <dd>For web tokens: <code>companies[0].id</code> from the JWT payload, updated when a manager switches franchise via <code>/changeCompany</code>. Multi-company admins correctly show the franchise they were actively viewing.</dd>

          <dt>Trend Arrows</dt>
          <dd>Compares event count in the first 14 days vs last 14 days of the month. ≥10% change = arrow, otherwise flat.</dd>

          <dt>Cohort Retention</dt>
          <dd>Cohort = ISO week of first appearance <em>within the dataset</em>. Users active before Jan 22 (earliest dump) appear as "new" on their first February event. True retention requires a longer baseline.</dd>

          <dt>Why This Matters</dt>
          <dd>This dashboard was built from a one-time database dump. The data pipeline was manual: dump → JSONL → Python analysis → static HTML. A proper datalake would make this real-time, automatable, and historically complete.</dd>
        </dl>
      </div>
    </div>

  </div>

      return [...this.D.companies].sort((a,b) => {
        const av = key === 'name' ? (a.shortname||a.name||'') : (a[key]||0);
        const bv = key === 'name' ? (b.shortname||b.name||'') : (b[key]||0);
        if (typeof av === 'string') return dir * av.localeCompare(bv);
        return dir * (av - bv);
      });
    },
    franchiseOps() {
      return this.D.admin_company_access
        .filter(u => u.num_companies > 3)
        .sort((a,b) => b.num_companies - a.num_companies);
    },
    retentionWeeks() {
      const weeks = new Set();
      Object.values(this.D.cohort_retention).forEach(r => Object.keys(r).forEach(w => weeks.add(w)));
      return [...weeks].sort();
    },
    retentionData() {
      const data = {};
      const cohorts = Object.keys(this.D.cohort_retention).sort();
      cohorts.forEach(cohort => {
        const r = this.D.cohort_retention[cohort];
        const firstWeek = Object.values(r)[0];
        const cells = {};
        Object.entries(r).forEach(([w, d]) => { cells[w] = d.pct; });
        data[cohort] = { total: firstWeek?.total || 0, cells };
      });
      return data;
    },
    inactiveCompanyCount() {
      const companiesWithManager = new Set();
      this.D.admin_company_access.forEach(a => {
        a.companies_accessed.forEach(c => companiesWithManager.add(c));
      });
      return this.D.meta.total_unique_companies - companiesWithManager.size;
    },
    filteredInactive() {
      const q = this.inactiveSearch.toLowerCase();
      const list = this.D.inactive_admins.filter(a => a.role === 'COMPANY');
      if (!q) return list;
      return list.filter(a =>
        (a.name||'').toLowerCase().includes(q) ||
        (a.company_name||'').toLowerCase().includes(q)
      );
    },
  },
  methods: {
    sortCompanies(key) {
      if (this.companySortKey === key) { this.companySortAsc = !this.companySortAsc; }
      else { this.companySortKey = key; this.companySortAsc = key === 'name'; }
    },
    sortIcon(key) {
      if (this.companySortKey !== key) return '';
      return this.companySortAsc ? ' ↑' : ' ↓';
    },
    async checkPassword() {
      const hash = Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(this.passwordInput)))).map(b=>b.toString(16).padStart(2,'0')).join('');
      if (hash === '9178cbddf0451fc85c13afdf093e8ccde96e92ceaf30ac5fa570b76e595ac6f7') {
        this.unlocked = true;
        this.passwordError = false;
        this.$nextTick(() => this.renderTabCharts());
      } else {
        this.passwordError = true;
        this.passwordInput = '';
      }
    },
    fmt(n) {
      if (n == null) return '0';
      return n.toLocaleString('en-US');
    },
    fmtMoney(n) {
      if (n == null) return '0';
      if (n >= 1000000) return (n / 1000000).toFixed(2) + 'M';
      if (n >= 1000) return (n / 1000).toFixed(0) + 'K';
      return n.toFixed(0);
    },
    weekLabel(isoWeek) {
      // "2026-W05" → "W05 (Jan 26 – Feb 01)" clamped to dataset range
      const [y, wPart] = isoWeek.split('-W');
      const yr = parseInt(y); const wk = parseInt(wPart);
      const jan4 = new Date(yr, 0, 4);
      const mon = new Date(jan4);
      mon.setDate(jan4.getDate() - (jan4.getDay() || 7) + 1 + (wk - 1) * 7);
      const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
      const rangeStart = new Date(D.meta.date_range[0] + 'T12:00:00');
      const rangeEnd = new Date(D.meta.date_range[1] + 'T12:00:00');
      const start = mon < rangeStart ? rangeStart : mon;
      const end = sun > rangeEnd ? rangeEnd : sun;
      const mf = (d) => d.toLocaleDateString('en-US', {month:'short', day:'numeric'});
      return 'W' + wPart + ' (' + mf(start) + ' – ' + mf(end) + ')';
    },
    isWeekend(dateStr) {
      const d = new Date(dateStr+'T12:00:00');
      return d.getDay() === 0 || d.getDay() === 6;
    },
    roleHeatVal(role, dateStr, hour) {
      return roleHeatMaps[role][dateStr+'_'+String(hour).padStart(2,'0')] || 0;
    },
    roleHeatColor(role, val) {
      if (val === 0) return '#f1f5f9';
      const max = roleHeatMax[role] || 1;
      const intensity = Math.pow(val / max, 0.6);
      const [r,g,b] = roleHeatRGB[role];
      return `rgba(${r}, ${g}, ${b}, ${(0.1 + intensity * 0.85).toFixed(2)})`;
    },
    trendClass(first, second) {
      const pct = (second - first) / first;
      if (pct > 0.1) return 'trend-up';
      if (pct < -0.1) return 'trend-down';
      return 'trend-flat';
    },
    trendArrow(first, second) {
      const pct = (second - first) / first;
      if (pct > 0.1) return '↑';
      if (pct < -0.1) return '↓';
      return '→';
    },
    trendPct(first, second) {
      if (first === 0) return '';
      const pct = Math.round(100 * (second - first) / first);
      return (pct > 0 ? '+' : '') + pct + '%';
    },
    retentionColor(pct) {
      if (pct >= 80) return '#16a34a';
      if (pct >= 60) return '#65a30d';
      if (pct >= 40) return '#d97706';
      if (pct >= 20) return '#ea580c';
      return '#dc2626';
    },
    destroyChart(id) {
      if (this.charts[id]) { this.charts[id].destroy(); delete this.charts[id]; }
    },
    chartScales() {
      return { y: { beginAtZero: true, grid: { color: '#f1f5f9' }, ticks: { color: '#64748b', font: { family: 'JetBrains Mono', size: 10 } } }, x: { grid: { color: '#f8fafc' }, ticks: { color: '#64748b', font: { family: 'Urbanist', size: 10 }, maxRotation: 45 } } };
    },
    chartLegend() {
      return { position: 'top', labels: { color: '#475569', font: { family: 'Urbanist', size: 11, weight: 600 }, padding: 16, usePointStyle: true, pointStyleWidth: 10, boxHeight: 10 } };
    },
    renderDailyChart() {
      this.destroyChart('daily');
      const ctx = document.getElementById('dailyChart');
      const labels = D.daily_summary.map(d => d.date.slice(5) + ' ' + d.weekday);
      const isUnique = this.overviewMode === 'unique';
      this.charts.daily = new Chart(ctx, {
        type: 'line',
        data: {
          labels,
          datasets: [
            { label: 'Clients', data: D.daily_summary.map(d => isUnique ? d.unique_user : d.events_user), borderColor: '#2563eb', backgroundColor: 'rgba(37,99,235,.06)', fill: true, tension: .35, pointRadius: 0, pointHoverRadius: 5, borderWidth: 2.5 },
            { label: 'Managers', data: D.daily_summary.map(d => isUnique ? d.unique_company : d.events_company), borderColor: '#d97706', backgroundColor: 'rgba(217,119,6,.06)', fill: true, tension: .35, pointRadius: 0, pointHoverRadius: 5, borderWidth: 2.5 },
            { label: 'Professors', data: D.daily_summary.map(d => isUnique ? d.unique_professor : d.events_professor), borderColor: '#16a34a', backgroundColor: 'rgba(22,163,74,.06)', fill: true, tension: .35, pointRadius: 0, pointHoverRadius: 5, borderWidth: 2.5 },
          ]
        },
        options: { responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false }, scales: this.chartScales(), plugins: { legend: this.chartLegend(), tooltip: { backgroundColor: '#1e293b', borderColor: '#334155', borderWidth: 1, titleFont: { family: 'Urbanist' }, bodyFont: { family: 'JetBrains Mono', size: 12 } } } }
      });
    },
    renderOriginChart() {
      this.destroyChart('origin');
      const ctx = document.getElementById('originChart');
      const days = D.daily_summary;
      this.charts.origin = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: days.map(d => d.date.slice(8)),
          datasets: [
            { label: 'App (Clients + Professors)', data: days.map(d => (d.unique_user||0) + (d.unique_professor||0)), backgroundColor: '#2563eb', borderRadius: 2 },
            { label: 'Web (Managers)', data: days.map(d => d.unique_company||0), backgroundColor: '#d97706', borderRadius: 2 },
          ]
        },
        options: { responsive: true, maintainAspectRatio: false, scales: { ...this.chartScales(), x: { ...this.chartScales().x, stacked: true }, y: { ...this.chartScales().y, stacked: true } }, plugins: { legend: this.chartLegend() } }
      });
    },
    renderWeeklyChart() {
      this.destroyChart('weekly');
      const ctx = document.getElementById('weeklyChart');
      this.charts.weekly = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: D.weekly_summary.map(w => this.weekLabel(w.week)),
          datasets: [
            { label: 'Clients', data: D.weekly_summary.map(w => w.unique_user), backgroundColor: '#2563eb', borderRadius: 3 },
            { label: 'Managers', data: D.weekly_summary.map(w => w.unique_company), backgroundColor: '#d97706', borderRadius: 3 },
            { label: 'Professors', data: D.weekly_summary.map(w => w.unique_professor), backgroundColor: '#16a34a', borderRadius: 3 },
          ]
        },
        options: { responsive: true, maintainAspectRatio: false, scales: this.chartScales(), plugins: { legend: this.chartLegend() } }
      });
    },
    renderCompanyCharts() {
      this.destroyChart('scatter');
      this.destroyChart('revPerUser');

      // Scatter: MRR vs unique users
      const scatterData = D.companies
        .filter(c => c.mrr > 0 && c.unique_users > 0)
        .map(c => ({ x: c.unique_users, y: c.mrr, r: Math.max(4, Math.sqrt(c.active_subs) * 1.2), label: c.shortname || c.name }));

      this.charts.scatter = new Chart(document.getElementById('scatterChart'), {
        type: 'bubble',
        data: { datasets: [{ data: scatterData, backgroundColor: 'rgba(37,99,235,.5)', borderColor: '#2563eb', borderWidth: 1 }] },
        options: {
          responsive: true, maintainAspectRatio: false,
          scales: {
            x: { title: { display: true, text: 'Unique Active Users (Feb)', color: '#64748b', font: { family: 'Urbanist', size: 12, weight: 600 } }, grid: { color: '#f1f5f9' }, ticks: { color: '#64748b', font: { family: 'JetBrains Mono', size: 10 } } },
            y: { title: { display: true, text: 'MRR (R$)', color: '#64748b', font: { family: 'Urbanist', size: 12, weight: 600 } }, grid: { color: '#f1f5f9' }, ticks: { color: '#64748b', font: { family: 'JetBrains Mono', size: 10 }, callback: v => 'R$' + (v/1000).toFixed(0) + 'K' } }
          },
          plugins: {
            legend: { display: false },
            tooltip: { callbacks: {
              label: ctx => {
                const d = ctx.raw;
                return [d.label, 'MRR: R$' + d.y.toLocaleString('en-US', {maximumFractionDigits:0}), 'Users: ' + d.x];
              }
            }}
          }
        }
      });

      // Rev per user bar - top 15
      const byRevSub = [...D.companies].filter(c => c.rev_per_sub > 0 && c.active_subs >= 10).sort((a,b) => b.rev_per_sub - a.rev_per_sub).slice(0, 15);
      this.charts.revPerUser = new Chart(document.getElementById('revPerUserChart'), {
        type: 'bar',
        data: {
          labels: byRevSub.map(c => c.shortname || c.name),
          datasets: [{ data: byRevSub.map(c => Math.round(c.rev_per_sub)), backgroundColor: '#2563eb', borderRadius: 3 }]
        },
        options: {
          indexAxis: 'y', responsive: true, maintainAspectRatio: false,
          plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => 'R$' + ctx.parsed.x + ' / subscriber' } } },
          scales: {
            x: { beginAtZero: true, grid: { color: '#f1f5f9' }, ticks: { color: '#64748b', font: { family: 'JetBrains Mono', size: 10 }, callback: v => 'R$' + v } },
            y: { grid: { display: false }, ticks: { color: '#475569', font: { family: 'Urbanist', size: 11 } } }
          }
        }
      });
    },
    renderUserCharts() {
      this.destroyChart('donut');
      this.destroyChart('actions');

      const roleTotals = D.daily_summary.reduce((acc, d) => {
        acc.user += d.events_user; acc.company += d.events_company;
        acc.professor += d.events_professor;
        return acc;
      }, {user:0, company:0, professor:0});

      this.charts.donut = new Chart(document.getElementById('roleDonut'), {
        type: 'doughnut',
        data: {
          labels: ['Clients (USER)', 'Managers (COMPANY)', 'Professors'],
          datasets: [{ data: [roleTotals.user, roleTotals.company, roleTotals.professor], backgroundColor: ['#2563eb','#d97706','#16a34a'], borderWidth: 0 }]
        },
        options: { responsive: true, maintainAspectRatio: false, cutout: '65%', plugins: { legend: { ...this.chartLegend(), position: 'right' } } }
      });

      const actions = Object.entries(D.actions.totals).slice(0, 10);
      this.charts.actions = new Chart(document.getElementById('actionsChart'), {
        type: 'bar',
        data: {
          labels: actions.map(a => a[0].replace(/_/g,' ')),
          datasets: [{ data: actions.map(a => a[1]), backgroundColor: '#94a3b8', borderRadius: 3 }]
        },
        options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { beginAtZero: true, grid: { color: '#f1f5f9' }, ticks: { color: '#64748b', font: { family: 'JetBrains Mono', size: 10 } } }, y: { grid: { display: false }, ticks: { color: '#475569', font: { family: 'Urbanist', size: 11 } } } } }
      });
    },
    renderRetentionChart() {
      this.destroyChart('newUsers');
      const cohorts = Object.keys(D.cohort_retention).sort();
      const sizes = cohorts.map(c => {
        const first = Object.values(D.cohort_retention[c])[0];
        return first ? first.total : 0;
      });
      this.charts.newUsers = new Chart(document.getElementById('newUsersChart'), {
        type: 'bar',
        data: {
          labels: cohorts.map(c => this.weekLabel(c)),
          datasets: [{ label: 'New users', data: sizes, backgroundColor: '#2563eb', borderRadius: 3 }]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: this.chartScales() }
      });
    },
    renderHourlyProfile() {
      this.destroyChart('hourlyProfile');
      const ctx = document.getElementById('hourlyProfileChart');
      // Aggregate events per hour across all days, per role
      const byHour = { user: new Array(24).fill(0), company: new Array(24).fill(0), professor: new Array(24).fill(0) };
      D.hourly_heatmap.forEach(h => {
        const hr = parseInt(h.hour);
        byHour.user[hr] += h.events_user || 0;
        byHour.company[hr] += h.events_company || 0;
        byHour.professor[hr] += h.events_professor || 0;
      });
      // Normalize each to percentage of its own total
      for (const role of ['user','company','professor']) {
        const total = byHour[role].reduce((a,b) => a+b, 0) || 1;
        byHour[role] = byHour[role].map(v => +(100 * v / total).toFixed(2));
      }
      const labels = Array.from({length:24}, (_,i) => String(i).padStart(2,'0') + 'h');
      this.charts.hourlyProfile = new Chart(ctx, {
        type: 'line',
        data: {
          labels,
          datasets: [
            { label: 'Clients', data: byHour.user, borderColor: '#2563eb', backgroundColor: 'rgba(37,99,235,.04)', fill: true, tension: .4, pointRadius: 0, pointHoverRadius: 5, borderWidth: 2.5 },
            { label: 'Managers', data: byHour.company, borderColor: '#d97706', backgroundColor: 'rgba(217,119,6,.04)', fill: true, tension: .4, pointRadius: 0, pointHoverRadius: 5, borderWidth: 2.5 },
            { label: 'Professors', data: byHour.professor, borderColor: '#16a34a', backgroundColor: 'rgba(22,163,74,.04)', fill: true, tension: .4, pointRadius: 0, pointHoverRadius: 5, borderWidth: 2.5 },
          ]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          scales: { ...this.chartScales(), y: { ...this.chartScales().y, ticks: { ...this.chartScales().y.ticks, callback: v => v + '%' } } },
          plugins: { legend: this.chartLegend(), tooltip: { callbacks: { label: ctx => ctx.dataset.label + ': ' + ctx.parsed.y.toFixed(1) + '% of monthly activity' } } }
        }
      });
    },
    renderTabCharts() {
      this.$nextTick(() => {
        if (this.tab === 'overview') { this.renderDailyChart(); this.renderOriginChart(); this.renderWeeklyChart(); this.renderHourlyProfile(); }
        if (this.tab === 'companies') { this.renderCompanyCharts(); }
        if (this.tab === 'users') { this.renderUserCharts(); }
        if (this.tab === 'retention') { this.renderRetentionChart(); }
      });
    }
  },
  watch: {
    tab() { this.renderTabCharts(); }
  },
  mounted() { if (this.unlocked) this.renderTabCharts(); }
});
app.mount('#app');
</script>
</body>
</html>
