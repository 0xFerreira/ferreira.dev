                                    <span>Projected payout</span>
                                    <span>R$ {{ billingData.prediction.net.toFixed(2) }}</span>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
            `
        }

        // ============ ADMIN VIEW COMPONENT ============
        const AdminView = {
            props: ['clubs', 'students', 'bookings', 'clubPlans', 'platformFee'],
            emits: ['update-fee'],
            setup(props, { emit }) {
                const { clubs, students, bookings, clubPlans, platformFee } = toRefs(props)

                const adminPage = ref('platform')
                const billingPeriod = ref('current')

                const getTargetPeriod = () => {
                    const now = new Date()
                    const currentMonth = now.getMonth()
                    const currentYear = now.getFullYear()
                    const lastMonth = currentMonth === 0 ? 11 : currentMonth - 1
                    const lastMonthYear = currentMonth === 0 ? currentYear - 1 : currentYear
                    return {
                        month: billingPeriod.value === 'current' ? currentMonth : lastMonth,
                        year: billingPeriod.value === 'current' ? currentYear : lastMonthYear
                    }
                }

                const billingPeriodLabel = computed(() => {
                    const { month, year } = getTargetPeriod()
                    return new Date(year, month).toLocaleDateString('en-US', { month: 'long', year: 'numeric' })
                })

                // Get active students (those with bookings in the period)
                const activeStudentIds = computed(() => {
                    const { month, year } = getTargetPeriod()
                    const ids = new Set()
                    for (const booking of bookings.value) {
                        const d = new Date(booking.date)
                        if (d.getMonth() === month && d.getFullYear() === year) {
                            for (const studentId of booking.students) {
                                ids.add(studentId)
                            }
                        }
                    }
                    return ids
                })

                // Students by plan (only active in period)
                const studentsByPlan = computed(() => {
                    const planCounts = {}
                    for (const student of students.value) {
                        if (!activeStudentIds.value.has(student.id)) continue
                        const plan = PLANS[student.id]
                        const planName = plan?.name ?? 'Unknown'
                        if (!planCounts[planName]) {
                            planCounts[planName] = { name: planName, count: 0, price: plan?.price ?? 0, revenue: 0 }
                        }
                        planCounts[planName].count++
                        planCounts[planName].revenue += plan?.price ?? 0
                    }
                    return Object.values(planCounts).sort((a, b) => b.revenue - a.revenue)
                })

                const totalStudents = computed(() => activeStudentIds.value.size)
                const totalStudentRevenue = computed(() => studentsByPlan.value.reduce((sum, p) => sum + p.revenue, 0))

                // Clubs by plan (all clubs, subscriptions are fixed)
                const clubsByPlan = computed(() => {
                    const planCounts = {}
                    for (const club of clubs.value) {
                        const plan = CLUB_PLANS.find(p => p.id === club.planId)
                        const planName = plan?.name ?? 'Unknown'
                        if (!planCounts[planName]) {
                            planCounts[planName] = { name: planName, count: 0, price: plan?.price ?? 0, revenue: 0 }
                        }
                        planCounts[planName].count++
                        planCounts[planName].revenue += plan?.price ?? 0
                    }
                    return Object.values(planCounts).sort((a, b) => b.revenue - a.revenue)
                })

                const totalClubs = computed(() => clubs.value.length)
                const totalClubRevenue = computed(() => clubsByPlan.value.reduce((sum, p) => sum + p.revenue, 0))

                // Platform revenue (fee from student payments)
                const platformRevenue = computed(() => (platformFee.value / 100) * totalStudentRevenue.value)
                const totalRevenue = computed(() => totalClubRevenue.value + platformRevenue.value)

                // Club payouts - revenue per club after platform cut minus subscription
                const clubPayouts = computed(() => {
                    const { month, year } = getTargetPeriod()

                    return clubs.value.map(club => {
                        const clubPlan = CLUB_PLANS.find(p => p.id === club.planId)
                        const subscription = clubPlan?.price ?? 0

                        // Get bookings for this club in the period
                        const clubBookings = bookings.value.filter(b => {
                            if (b.clubId !== club.id) return false
                            const d = new Date(b.date)
                            return d.getMonth() === month && d.getFullYear() === year
                        })

                        // Calculate gross revenue from student credits
                        let grossRevenue = 0
                        for (const booking of clubBookings) {
                            for (const studentId of booking.students) {
                                const plan = PLANS[studentId]
                                if (plan && plan.creditsPerMonth > 0) {
                                    grossRevenue += plan.price / plan.creditsPerMonth
                                }
                            }
                        }

                        const platformCut = (platformFee.value / 100) * grossRevenue
                        const netRevenue = grossRevenue - platformCut
                        const payout = netRevenue - subscription
                        const totalBookings = clubBookings.reduce((sum, b) => sum + b.students.length, 0)

                        return {
                            id: club.id,
                            name: club.name,
                            plan: clubPlan?.name ?? '-',
                            subscription,
                            totalBookings,
                            grossRevenue,
                            platformCut,
                            netRevenue,
                            payout
                        }
                    }).sort((a, b) => b.payout - a.payout)
                })

                const totalPayout = computed(() => clubPayouts.value.reduce((sum, c) => sum + c.payout, 0))
                const totalGrossRevenue = computed(() => clubPayouts.value.reduce((sum, c) => sum + c.grossRevenue, 0))
                const totalPlatformCut = computed(() => clubPayouts.value.reduce((sum, c) => sum + c.platformCut, 0))
                const totalSubscriptions = computed(() => clubPayouts.value.reduce((sum, c) => sum + c.subscription, 0))

                const updateFee = (e) => {
                    const val = parseInt(e.target.value) || 0
                    emit('update-fee', Math.max(0, Math.min(100, val)))
                }

                const adjustAllPrices = (pct) => {
                    for (const plan of clubPlans.value) {
                        plan.price = Math.round(plan.price * (1 + pct / 100) * 100) / 100
                    }
                }

                return { adminPage, billingPeriod, billingPeriodLabel, studentsByPlan, totalStudents, totalStudentRevenue, clubsByPlan, totalClubs, totalClubRevenue, platformFee, platformRevenue, totalRevenue, clubPayouts, totalPayout, totalGrossRevenue, totalPlatformCut, totalSubscriptions, updateFee, clubPlans, adjustAllPrices }
            },
            template: `
                <div class="layout">
                    <div class="panel">
                        <h2 class="panel-title">Platform Configuration</h2>
                        <div class="config-row">
                            <label>Platform fee on student payments</label>
                            <div class="config-input">
                                <input type="number" :value="platformFee" @input="updateFee" min="0" max="100">
                                <span>%</span>
                            </div>
                        </div>
                    </div>

                    <div class="panel">
                        <div class="panel-header">
                            <h2 class="panel-title">Club Subscriptions</h2>
                            <div class="adjust-buttons">
                                <button @click="adjustAllPrices(-5)">-5%</button>
                                <button @click="adjustAllPrices(5)">+5%</button>
                            </div>
                        </div>
                        <div class="config-table">
                            <div class="config-table-header">
                                <span>Plan</span>
                                <span>Max Clients</span>
                                <span>Monthly Price</span>
                            </div>
                            <div v-for="plan in clubPlans" :key="plan.id" class="config-table-row">
                                <span>{{ plan.name }}</span>
                                <span>{{ plan.maxClients }}</span>
                                <div class="config-input">
                                    <span>R$</span>
                                    <input type="number" v-model.number="plan.price" min="0" step="0.01">
                                </div>

                    const candidate = getStudent(candidateId)
                    if (!candidate) return { ok: false, reason: 'Student not found' }
                    for (const id of existingIds) {
                        const existing = getStudent(id)
                        if (!existing) continue
                        if (Math.abs(existing.age - candidate.age) > club.maxAgeDelta) return { ok: false, reason: 'age' }
                        if (Math.abs(existing.level - candidate.level) > club.maxLevelDelta) return { ok: false, reason: 'level' }
                    }
                    return { ok: true }
                }

                function isSlotPast(date, hour) {
                    const now = new Date()
                    const today = formatDate(now)
                    return date < today || (date === today && hour <= now.getHours())
                }

                function book(clubId, templateId, date, studentId, { seed = false } = {}) {
                    const student = getStudent(studentId)
                    const club = getClub(clubId)
                    const template = getTemplate(templateId)

                    if (!student || !club || !template) return { ok: false, reason: 'Invalid data' }
                    if (!seed && isSlotPast(date, template.startHour)) return { ok: false, reason: 'Slot in the past' }
                    if (student.credits <= 0) return { ok: false, reason: 'No credits' }
                    if (club.blockedSlots.includes(templateId)) return { ok: false, reason: 'Slot blocked' }
                    if (club.minAge && student.age < club.minAge) return { ok: false, reason: 'Below minimum age' }

                    const booking = bookings.find(b => b.clubId === clubId && b.templateId === templateId && b.date === date)

                    if (booking) {
                        if (booking.students.includes(studentId)) return { ok: false, reason: 'Already booked' }
                        if (booking.students.length >= template.capacity) return { ok: false, reason: 'Full' }
                        const match = checkMatch(booking.students, studentId, club)
                        if (!match.ok) return { ok: false, reason: match.reason }
                        booking.students.push(studentId)
                    } else {
                        bookings.push({ clubId, templateId, date, students: [studentId] })
                    }

                    student.credits--
                    transactions[studentId].unshift({ date: new Date().toISOString(), type: 'used', amount: 1, description: slotDesc(club, template) })
                    return { ok: true }
                }

                function cancel(clubId, templateId, date, studentId) {
                    const student = getStudent(studentId)
                    const club = getClub(clubId)
                    const template = getTemplate(templateId)

                    if (!student || !club || !template) return { ok: false, reason: 'Invalid data' }
                    if (isSlotPast(date, template.startHour)) return { ok: false, reason: 'Slot in the past' }

                    const booking = bookings.find(b => b.clubId === clubId && b.templateId === templateId && b.date === date)
                    if (!booking) return { ok: false, reason: 'No booking found' }

                    const idx = booking.students.indexOf(studentId)
                    if (idx === -1) return { ok: false, reason: 'Student not in booking' }

                    booking.students.splice(idx, 1)
                    student.credits++
                    transactions[studentId].unshift({ date: new Date().toISOString(), type: 'refund', amount: 1, description: `Cancelled ${slotDesc(club, template)}` })

                    return { ok: true }
                }

                const tid = (dayOfWeek, hour) => SLOT_TEMPLATES.find(t => t.dayOfWeek === dayOfWeek && t.startHour === hour)?.id

            }
        })
